<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial,sans-serif;
    overflow:hidden;
    background: radial-gradient(circle at top, #f6fff7, #dfffe6, #c9f7d4);
    position:relative;
}

/* 🌫️ soft vignette + glow overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.15));
    pointer-events:none;
}

body::after{
    content:"";
    position:absolute;
    inset:-20%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(255,182,255,0.25), transparent 60%);
    filter: blur(40px);
    opacity:0.7;
    pointer-events:none;
}

/* 🌸 FLOATING PETALS */
.petal{
    position:absolute;
    top:-50px;
    font-size:24px;
    opacity:0.7;
    animation: fall linear infinite;
    z-index:0;
    pointer-events:none;
}

@keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    100%{ transform: translateY(110vh) translateX(80px) rotate(360deg); opacity:0; }
}

/* TITLE */
h1{
    margin-bottom:20px;
    position:relative;
    z-index:2;
    color:#2b2b2b;
    text-shadow:0 2px 10px rgba(0,0,0,0.15);
}

/* INPUTS (glass blur effect) */
input[type="text"],input[type="password"]{
    width:280px;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    position:relative;
    z-index:2;
    outline:none;
}

/* BUTTON */
button{
    padding:12px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    position:relative;
    z-index:2;
    background: linear-gradient(135deg, #ff7ac3, #ff4fa3);
    color:white;
    box-shadow:0 10px 25px rgba(255,79,163,0.3);
    transition:0.3s ease;
}

button:hover{
    transform: translateY(-2px);
    box-shadow:0 15px 30px rgba(255,79,163,0.4);
}

/* ENVELOPE CONTAINER */
#envelopeContainer{
    display:none;
    justify-content:center;
    align-items:center;
    margin-top:40px;
    position:relative;
    z-index:2;
}

/* ENVELOPE */
.envelope{
    position:relative;
    width:70vw;
    max-width:650px;
    height:45vw;
    max-height:420px;
    cursor:pointer;
    overflow:hidden;
    perspective:1000px;

    /* ✨ soft glow */
    filter: drop-shadow(0 0 25px rgba(255, 120, 200, 0.25));
}

/* BODY */
.body{
    position:absolute;
    width:100%;
    height:100%;
    background: linear-gradient(145deg, #e3b078, #d49a5a);
    z-index:1;
}

/* LETTER (glass paper feel) */
.letter{
    position:absolute;
    width:90%;
    height:85%;
    left:5%;
    top:100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius:12px;
    padding:20px;
    box-sizing:border-box;
    text-align:left;
    transition:1s ease;
    z-index:2;
    overflow:auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* FLAP */
.flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50%;
    background: linear-gradient(145deg, #d39a5c, #c98c4d);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition:1s ease;
    z-index:3;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

/* RIBBONS */
.ribbon{
    position:absolute;
    background:#ff4fa3;
    z-index:4;
    box-shadow:0 0 15px rgba(255,79,163,0.4);
}

.ribbon.horizontal{
    width:100%;
    height:18px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

.ribbon.vertical{
    width:18px;
    height:100%;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* BOW */
.bow{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:42px;
    z-index:5;
    transition:0.6s ease;
    pointer-events:none;
    filter: drop-shadow(0 0 10px rgba(255,79,163,0.4));
}

/* OPEN EFFECT */
.envelope.open .flap{
    transform: rotateX(180deg);
}

.envelope.open .letter{
    top:5%;
}

.envelope.open .bow{
    transform:translate(-50%, -50%) scale(0);
    opacity:0;
}

/* SNAP */
.ribbon.snap.horizontal{ animation: snapH 0.6s forwards; }
.ribbon.snap.vertical{ animation: snapV 0.6s forwards; }

@keyframes snapH{
    0%{ transform:translateY(-50%) scaleX(1); opacity:1; }
    50%{ transform:translateY(-50%) scaleX(1.3) rotate(5deg); }
    100%{ transform:translateY(-200%) scaleX(0); opacity:0; }
}

@keyframes snapV{
    0%{ transform:translateX(-50%) scaleY(1); opacity:1; }
    50%{ transform:translateX(-50%) scaleY(1.3) rotate(-5deg); }
    100%{ transform:translateX(-50%) scaleY(0); opacity:0; }
}
</style>
</head>

<body>

<h1>Open Your Letter! 💌</h1>

<div id="loginSection">
    <input type="text" id="name" placeholder="Enter your name">
    <br>

    <input type="password" id="password" placeholder="Enter password">
    <br>

    <label>
        <input type="checkbox" onclick="togglePassword()"> Show Password
    </label>

    <br><br>

    <button onclick="checkAccess()">Open Letter</button>
</div>

<div id="envelopeContainer">
    <div class="envelope" onclick="openEnvelope()">

        <div class="bow">🎀</div>

        <div class="ribbon horizontal"></div>
        <div class="ribbon vertical"></div>

        <div class="flap"></div>
        <div class="body"></div>
        <div class="letter" id="letter"></div>

    </div>
</div>

<script>
function togglePassword(){
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}

function burstPetals(){
    const emojis = ["🌸","🌺","🌷","💮","💖"];

    for(let i=0;i<25;i++){
        const petal = document.createElement("div");
        petal.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
        petal.style.position = "absolute";
        petal.style.left = "50%";
        petal.style.top = "50%";
        petal.style.fontSize = (16 + Math.random()*20) + "px";
        petal.style.zIndex = 10;
        petal.style.pointerEvents = "none";

        document.body.appendChild(petal);

        const angle = Math.random() * 2 * Math.PI;
        const distance = 150 + Math.random()*200;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        petal.animate([
            { transform:`translate(0,0)`, opacity:1 },
            { transform:`translate(${x}px, ${y}px)`, opacity:0 }
        ], {
            duration: 1200,
            easing: "ease-out"
        });

        setTimeout(()=>petal.remove(), 1200);
    }
}

function openEnvelope(){
    const env = document.querySelector(".envelope");
    const isOpen = env.classList.contains("open");

    env.classList.toggle("open");

    if(!isOpen){
        setTimeout(()=>{
            document.querySelector(".ribbon.horizontal").classList.add("snap");
            document.querySelector(".ribbon.vertical").classList.add("snap");
            burstPetals();
        }, 300);
    }
}

function showLetter(message){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("envelopeContainer").style.display = "flex";
    document.getElementById("letter").innerHTML = message;
}

function checkAccess(){
    const name = document.getElementById("name").value.trim();
    const password = document.getElementById("password").value;

    if(name==="Zyrah" && password==="Pugs123"){
        showLetter("<h2>Dear Zy,</h2><p>Love you 💖</p>");
    }

    if(name==="Juan" && password==="GoUSTE"){
        showLetter("<h2>Dear Juan,</h2><p>Love you 💖</p>");
    }

    if(name==="Michelle" && password==="Heeseung"){
        showLetter("<h2>Dear El,</h2><p>Love you 💖</p>");
    }

    if(name==="Zion" && password==="Zeeon123"){
        showLetter("<h2>Dear Zion,</h2><p>Love you 💖</p>");
    }

    if(name==="Loren" && password==="Loren123"){
        showLetter("<h2>Dear Loren,</h2><p>Love you 💖</p>");
    }

    if(name==="Sherbei" && password==="Bebei123"){
        showLetter("<h2>Dear Bei,</h2><p>Love you 💖</p>");
    }

    if(name==="Francine" && password==="Cine123"){
        showLetter("<h2>Dear Cine,</h2><p>Love you 💖</p>");
    }

    if(name==="Miley" && password==="FumiHuxley123"){
        showLetter("<h2>Dear Baby,</h2><p>Love you 💖</p>");
    }
        
    else{
        alert("Wrong name or password.");
    }
}
</script>

</body>
</html>
