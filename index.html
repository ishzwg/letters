<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial,sans-serif;
    background:#e6fce9;
    overflow:hidden;
}

/* UI */
h1{margin-bottom:20px; position:relative; z-index:2;}

input[type="text"],input[type="password"]{
    width:280px;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ccc;
    position:relative;
    z-index:2;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    position:relative;
    z-index:2;
}

/* ENVELOPE */
#envelopeContainer{
    display:none;
    justify-content:center;
    align-items:center;
    margin-top:40px;
    position:relative;
    z-index:2;
}

.envelope{
    position:relative;
    width:70vw;
    max-width:650px;
    height:45vw;
    max-height:420px;
    cursor:pointer;
    overflow:hidden;
    perspective:1000px;
}

/* BODY */
.body{
    position:absolute;
    width:100%;
    height:100%;
    background:#d9a066;
    z-index:1;
}

/* LETTER */
.letter{
    position:absolute;
    width:90%;
    height:85%;
    left:5%;
    top:100%;
    background:white;
    border-radius:10px;
    padding:20px;
    box-sizing:border-box;
    text-align:left;
    transition:1s ease;
    z-index:2;

    overflow-y:auto;
    overflow-x:hidden;
    word-wrap:break-word;
    overflow-wrap:break-word;
}

/* FLAP */
.flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50%;
    background:#c98c4d;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition:1s ease;
    z-index:3;
}

/* 🎀 RIBBON */
.ribbon{
    position:absolute;
    background:#ff4fa3;
    z-index:4;
}

.ribbon.horizontal{
    width:100%;
    height:18px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

.ribbon.vertical{
    width:18px;
    height:100%;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* 🎀 BOW */
.bow{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:42px;
    z-index:5;
    transition:0.6s ease;
    pointer-events:none;
}

.envelope.open .bow{
    transform:translate(-50%, -50%) scale(0);
    opacity:0;
}

/* SNAP ANIMATION */
.ribbon.snap.horizontal{
    animation: snapH 0.6s forwards;
}

.ribbon.snap.vertical{
    animation: snapV 0.6s forwards;
}

@keyframes snapH{
    0%{ transform:translateY(-50%) scaleX(1); opacity:1; }
    50%{ transform:translateY(-50%) scaleX(1.3) rotate(5deg); }
    100%{ transform:translateY(-200%) scaleX(0); opacity:0; }
}

@keyframes snapV{
    0%{ transform:translateX(-50%) scaleY(1); opacity:1; }
    50%{ transform:translateX(-50%) scaleY(1.3) rotate(-5deg); }
    100%{ transform:translateX(-50%) scaleY(0); opacity:0; }
}

/* OPEN */
.envelope.open .flap{
    transform: rotateX(180deg);
}

.envelope.open .letter{
    top:5%;
}
</style>
</head>

<body>

<h1>Open Your Letter! 😁</h1>

<div id="loginSection">
    <input type="text" id="name" placeholder="Enter your name">
    <br>

    <input type="password" id="password" placeholder="Enter password">
    <br>

    <label>
        <input type="checkbox" onclick="togglePassword()"> Show Password
    </label>

    <br><br>

    <button onclick="checkAccess()">Open Letter</button>
</div>

<div id="envelopeContainer">
    <div class="envelope" onclick="openEnvelope()">

        <div class="bow">🎀</div>

        <div class="ribbon horizontal"></div>
        <div class="ribbon vertical"></div>

        <div class="flap"></div>
        <div class="body"></div>
        <div class="letter" id="letter"></div>

    </div>
</div>

<script>
function togglePassword(){
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}

/* 🌸 FLOWER BURST FROM LETTER */
function flowerBurst(){
    const emojis = ["🌸","🌺","🌷","💮","💖"];

    const letter = document.getElementById("letter");
    const rect = letter.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    for(let i = 0; i < 25; i++){
        const flower = document.createElement("div");
        flower.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

        flower.style.position = "fixed";
        flower.style.left = centerX + "px";
        flower.style.top = centerY + "px";
        flower.style.fontSize = (18 + Math.random() * 20) + "px";
        flower.style.zIndex = 9999;
        flower.style.pointerEvents = "none";

        document.body.appendChild(flower);

        const angle = Math.random() * 2 * Math.PI;
        const distance = 120 + Math.random() * 250;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        flower.animate([
            { transform: "translate(0,0)", opacity: 1 },
            { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
        ], {
            duration: 1200,
            easing: "ease-out"
        });

        setTimeout(() => flower.remove(), 1200);
    }
}

/* OPEN ENVELOPE */
function openEnvelope(){
    const env = document.querySelector(".envelope");
    const wasClosed = !env.classList.contains("open");

    env.classList.toggle("open");

    if(wasClosed){
        setTimeout(()=>{
            document.querySelector(".ribbon.horizontal").classList.add("snap");
            document.querySelector(".ribbon.vertical").classList.add("snap");

            flowerBurst(); // 🌸
        }, 300);
    }
}

function showLetter(message){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("envelopeContainer").style.display = "flex";
    document.getElementById("letter").innerHTML = message;
}

function checkAccess(){
    const name = document.getElementById("name").value.trim();
    const password = document.getElementById("password").value;

    if(name==="Zyrah" && password==="Pugs123"){
        showLetter("<h2>Dear Zy,</h2><p>Love you 💖</p>");
    }
    else if(name==="Juan" && password==="GoUSTE"){
        showLetter("<h2>Dear Juan,</h2><p>Love you 💖</p>");
    }
    else if(name==="Michelle" && password==="Heeseung123"){
        showLetter("<h2>Hi El,</h2><p>Love you 💖</p>");
    }
    else if(name==="Zion" && password==="Zeeon123"){
        showLetter("<h2>Dear Zion,</h2><p>Love you 💖</p>");
    }
    else if(name==="Miley" && password==="FumiHuxley123"){
        showLetter("<h2>Dear Baby,</h2><p>Love you 💖</p>");
    }
    else if(name==="Sherbei" && password==="Beibei123"){
        showLetter("<h2>Dear Sherbei,</h2><p>Love you 💖</p>");
    }
    else if(name==="Loren" && password==="LorenIpsum123"){
        showLetter("<h2>Dear Loren,</h2><p>Love you 💖</p>");
    }
    else if(name==="Francine" && password==="Cine123"){
        showLetter("<h2>Dear Francine,</h2><p>Love you 💖</p>");
    }
    else{
        alert("Wrong name or password.");
    }
}
</script>

</body>
</html>
